<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>雪夜 · 如果降雪数据变成雪</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230b1220'/%3E%3Cpath d='M16 5v22M6.5 10.5l19 11M6.5 21.5l19-11' stroke='%23dbe7ff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <script type="module" crossorigin src="./assets/index-o24iggD0.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CHgIdm1I.css">
</head>
<body>
  <canvas id="view"></canvas>

  <div id="topbar" class="ui">
    <button id="btnPanel" title="显示/隐藏面板">面板</button>
    <button id="btnCam" class="on" title="镜头自动缓慢移动">自动运镜</button>
    <button id="btnSound" title="风声">风声 关</button>
    <select id="selQuality" title="画质（切换后会重新加载）">
      <option value="low">画质 低</option>
      <option value="medium">画质 中</option>
      <option value="high">画质 高</option>
    </select>
    <button id="btnFull" title="全屏">全屏</button>
  </div>

  <aside id="panel" class="ui">
    <header>
      <div class="eyebrow">00:00 — 24:00</div>
      <h1>编辑降雪数据</h1>
      <p>拖动折线节点即可实时预览；也可以展开数字输入进行精确编辑。</p>
    </header>

    <section class="card">
      <div class="row">
        <h2>逐时降雪曲线</h2><span class="badge">实时生效</span>
        <span class="readout"><span id="curveTime">18:00</span><b id="curveVal">0.0</b><i>cm/h</i></span>
      </div>
      <svg id="curve" viewBox="0 0 340 170" tabindex="-1"></svg>
      <div class="hint">上下拖动节点调整强度 · 方向键微调 · Shift + 方向键快速调整</div>
      <div class="timeline">
        <button id="btnPlay" title="播放/暂停（空格）">❚❚</button>
        <input id="time" type="range" min="0" max="24" step="0.01" />
        <select id="speed" title="一天的时长">
          <option value="60">1 分钟/天</option>
          <option value="240">4 分钟/天</option>
          <option value="900">15 分钟/天</option>
        </select>
      </div>
    </section>

    <section class="chips" id="presets"></section>

    <section class="card" id="sliders">
      <h2>气候</h2>
    </section>

    <details class="card" id="precise">
      <summary><h2>精确输入 25 个时间点</h2><span class="unit">单位：cm/h</span></summary>
      <div class="grid" id="grid"></div>
    </details>

    <footer>
      <button id="btnReset">恢复默认</button>
      <button id="btnClear" class="primary">清空积雪</button>
    </footer>
  </aside>

  <div id="hud" class="ui">
    <div class="big" id="hudTime">18:30</div>
    <div class="item"><span>降雪</span><b id="hudRate">0.0 cm/h</b><em id="hudLabel">小雪</em></div>
    <div class="item"><span>气温</span><b id="hudTemp">-6 °C</b><em id="hudType">干雪</em></div>
    <div class="item"><span>风</span><b id="hudWind">3 m/s</b></div>
    <div class="item"><span>积雪</span><b id="hudDepth">10 cm</b></div>
  </div>

  <div id="tip" class="ui">拖动画面旋转 · 滚轮缩放 · 空格 播放/暂停 · H 隐藏界面</div>
</body>
</html>
